name: cal45

services:
  radicale:
    image: ghcr.io/kozea/radicale:stable   # spaeter auf feste Version pinnen
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      # IP und Port kommen aus der .env (siehe .env.example).
      # Default 127.0.0.1 = nur lokal erreichbar, falls keine .env existiert.
      - "${CAL45_BIND_IP:-127.0.0.1}:${CAL45_PORT:-5232}:5232"
    volumes:
      - ./config:/etc/radicale:ro
      - ./data:/var/lib/radicale
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5232/.web/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
