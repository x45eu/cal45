name: cal45

services:
  radicale:
    image: ghcr.io/kozea/radicale:stable   # spaeter auf feste Version pinnen
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      # LAN-IP des Debian-Servers; NetBird-Reverse-Proxy erreicht sie
      # ueber den OPNsense-Routing-Peer.
      - "10.10.34.32:5232:5232"
    volumes:
      - ./config:/etc/radicale:ro
      - ./data:/var/lib/radicale
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5232/.web/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
