name: cal45

services:
  cal45:
    # DAV backend is reachable only from the host on loopback.
    image: ghcr.io/kozea/radicale:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ./config:/etc/radicale:ro
      - ./data:/var/lib/radicale

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
