name: cal45
services:
  cal45:
    image: ghcr.io/kozea/radicale:stable
    restart: unless-stopped
    networks: [dav_internal]
    volumes:
      - ./config:/etc/radicale:ro
      - ./data:/var/lib/radicale
  gateway:
    build:
      context: .
      dockerfile: web.Dockerfile
    command: ["dav-gateway"]
    restart: unless-stopped
    depends_on: [cal45]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      CAL45_GATEWAY_BIND: "0.0.0.0:8081"
      CAL45_DAV_UPSTREAM: "http://cal45:5232"
    volumes:
      - cal45_auth:/var/lib/cal45
    networks: [dav_internal, default]
  auth:
    profiles: ["auth-preview"]
    build:
      context: .
      dockerfile: passkeys/Dockerfile
    restart: unless-stopped
    # Auth service is intentionally bound only to host loopback.
    # A trusted HTTPS proxy must route /auth/ to this service.
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      CAL45_AUTH_BIND: "0.0.0.0:8082"
      CAL45_AUTH_ORIGIN: "${CAL45_AUTH_ORIGIN:-}"
      CAL45_TOKEN_FILE: "/var/lib/cal45/tokens.json"
      CAL45_PASSKEY_FILE: "/var/lib/cal45/passkeys.json"
      CAL45_BOOTSTRAP_FILE: "/var/lib/cal45/bootstrap.json"
    volumes:
      - cal45_auth:/var/lib/cal45
    depends_on: [gateway]
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
networks:
  dav_internal:
    internal: true
volumes:
  cal45_auth:
