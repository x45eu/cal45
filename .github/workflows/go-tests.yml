name: Cal45 Go tests
on:
  push:
    paths: ["cmd/**", "go.mod", ".github/workflows/go-tests.yml"]
  pull_request:
    paths: ["cmd/**", "go.mod", ".github/workflows/go-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
