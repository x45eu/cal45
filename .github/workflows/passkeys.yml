name: Cal45 Passkey verifier
on:
  push:
    paths: ["passkeys/**", ".github/workflows/passkeys.yml"]
  pull_request:
    paths: ["passkeys/**", ".github/workflows/passkeys.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passkeys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - run: go test -mod=readonly -race ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly ./cmd/cal45-passkey-bootstrap
