name: Cal45 Passkey verifier
on:
  push:
    paths: ["passkeys/**", ".github/workflows/passkeys.yml"]
  pull_request:
    paths: ["passkeys/**", ".github/workflows/passkeys.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passkeys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      # Temporary dependency resolution until go.sum is committed.
      - run: go mod tidy
      - run: go test -race ./...
      - run: go vet ./...
